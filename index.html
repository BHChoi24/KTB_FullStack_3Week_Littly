<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="device-with", intrial-scald="1.0">

    <link rel="stylesheet" type="text/css" href="index.css">
    <!-- 아래 "프로젝트 이름"을 자기 자신의 이름으로 변경 -->
    <title> 나만의 프로필 만들기 </title>
</head>

<body>
    <section class="wrap">
        <article class="profile">
		    <img class="image" src="/images/profile_img.webp"/>
		    <h1 class="name">최보현</h1>
		    <p class="description">카테부 풀스텍 4기 joshua.choi(최보현)입니다! 🙌</p>
        </article>

        <!-- 경계선 추가-->
        <hr class="horizontal-rule"/>
        <!-- 깃허브에 올리기 때문에 개인정보는 제거하였습니다.-->
        <article class="external">
            <a id="phone" class="link" href="tel: 전화번호 ">
                <img src="/images/logo/telephone.svg"/>
            </a>
            <a id="email" class="link"  href="mailto: 이메일 ">
                <img src="/images/logo/email.svg"/>
            </a>
            <a id="instagram" class="link" href=" 인스타링크 " target="_blank">
                <img src="/images/logo/instagram.svg"/>
            </a>
        </article>
        <!-- 버튼추가 -->
        <article class="buttons">
            <a class="button" href="https://github.com/BHChoi24" target="_blank">깃허브 프로필</a>
        </article>
        
        <!-- 택스트 추가하고 글씨 크기 -->
        <article class="text">
            <p class="small"> IT융합을 전공하였습니다. 코드를 많이 짜보는 능력이 부족하다고 느끼고 있고 전공지식을 깊게 파고들고, 접목하여 이번 카테부를 통해 성장하고 싶습니다!</p>
        </article>

        <!-- 이미지 -->
        <article class="photo">
            <img src="/images/photo/photo_1.jpg"/>
            <img src="/images/photo/photo_2.jpg"/>

        </article>
        <!-- 동영상 -->
        <article class="youtube">
            <iframe  src="https://www.youtube.com/embed/Eakt1tkxIXc?si=zoRVSqjrcgWXMovh?controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </article>

        <article class="text">
            <p class="small"> 유튜브 링크는 최근에 많이 들은 노래를 넣었습니다 </p>
        </article>
        
    </section>
</body>
</html>
